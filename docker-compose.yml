services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    command: mosquitto -c /mosquitto-no-auth.conf # simple demo broker, no login
  influxdb:
    image: influxdb:2.7
    ports: ["8086:8086"]
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: admin12345
      DOCKER_INFLUXDB_INIT_ORG: hcl
      DOCKER_INFLUXDB_INIT_BUCKET: machines
      DOCKER_INFLUXDB_INIT_RETENTION: 30d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: p214-token
    volumes: ["influx-data:/var/lib/influxdb2"]
  grafana:
    image: grafana/grafana:10.4.2
    ports: ["3000:3000"]
    depends_on: [influxdb]
    volumes: ["grafana-data:/var/lib/grafana"]
volumes:
  influx-data:
  grafana-data:
